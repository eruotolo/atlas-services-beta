# Stack de desarrollo completo de Hireeo.
# Todos los servicios quedan agrupados bajo el proyecto "hireeo" en Docker Desktop.
#
#   docker compose up -d --build     levantar todo
#   docker compose logs -f frontend  ver logs
#   docker compose down              bajar todo (los datos de Postgres persisten)
#
# appmobile (Expo) no se dockeriza: necesita la red del host para el QR y el dev client.

name: hireeo

services:
    postgres:
        image: postgres:16-alpine
        container_name: hireeo-postgres
        restart: unless-stopped
        ports:
            - '5435:5432'
        volumes:
            - ./docker-database/postgres-data/pgdata:/var/lib/postgresql/data
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
            interval: 5s
            timeout: 5s
            retries: 12
        networks:
            - hireeo

    adminer:
        image: adminer:latest
        container_name: hireeo-adminer
        restart: unless-stopped
        ports:
            - '8081:8080'
        environment:
            ADMINER_DEFAULT_SERVER: postgres
        depends_on:
            postgres:
                condition: service_healthy
        networks:
            - hireeo

    backend:
        build:
            context: .
            dockerfile: docker/backend.dev.Dockerfile
        container_name: hireeo-backend
        restart: unless-stopped
        command: pnpm --filter backend dev
        ports:
            - '4000:4000'
        environment:
            NODE_ENV: development
            PORT: 4000
            # Dentro de la red de Docker el host es `postgres` y el puerto el interno (5432).
            # Pisa el valor de backend/.env.local (dotenv no sobrescribe process.env).
            DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
            DIRECT_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
            FRONTEND_URL: http://localhost:3333
            # Los eventos de filesystem de macOS no cruzan el bind mount, así que el
            # watch de tsc (nest start --watch) no se entera de los cambios.
            # Estas dos variables lo pasan a polling.
            TSC_WATCHFILE: DynamicPriorityPolling
            TSC_WATCHDIRECTORY: DynamicPriorityPolling
        volumes:
            - .:/app
            # Volúmenes anónimos: preservan los node_modules instalados en la imagen
            # (pnpm usa symlinks al store de la raíz, por eso hay que tapar los 3 niveles).
            - /app/node_modules
            - /app/backend/node_modules
            - /app/frontend/node_modules
            - /app/appmobile/node_modules
            - /app/frontend/.next
        # No hay endpoint /health en el backend: alcanza con que responda algo
        # (fetch resuelve incluso con 404, lo que prueba que está escuchando).
        healthcheck:
            test:
                [
                    'CMD',
                    'node',
                    '-e',
                    "fetch('http://localhost:4000/api/v1').then(()=>process.exit(0)).catch(()=>process.exit(1))",
                ]
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 60s
        depends_on:
            postgres:
                condition: service_healthy
        networks:
            - hireeo

    frontend:
        build:
            context: .
            dockerfile: docker/frontend.dev.Dockerfile
        container_name: hireeo-frontend
        restart: unless-stopped
        command: pnpm --filter frontend dev
        ports:
            - '3333:3333'
        environment:
            NODE_ENV: development
            # El navegador llega al backend por el puerto publicado en el host…
            NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
            # …y el código server-side, por el DNS interno de Docker.
            # Ver frontend/src/lib/api/apiBaseUrl.ts.
            INTERNAL_API_URL: http://backend:4000/api/v1
            NEXT_PUBLIC_APP_URL: http://localhost:3333
            AUTH_URL: http://localhost:3333
            NEXTAUTH_URL: http://localhost:3333
            # Los eventos de filesystem no siempre cruzan los bind mounts de macOS.
            WATCHPACK_POLLING: 'true'
            CHOKIDAR_USEPOLLING: 'true'
        volumes:
            - .:/app
            - /app/node_modules
            - /app/backend/node_modules
            - /app/frontend/node_modules
            - /app/appmobile/node_modules
            - /app/frontend/.next
        healthcheck:
            test:
                [
                    'CMD',
                    'node',
                    '-e',
                    "fetch('http://localhost:3333/cl').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
                ]
            interval: 15s
            timeout: 10s
            retries: 5
            start_period: 90s
        depends_on:
            backend:
                condition: service_healthy
        networks:
            - hireeo

networks:
    hireeo:
        driver: bridge
